name: Check application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run setup:api
      - run: .venv/bin/pip install -r requirements-analytics.txt
      - run: npm test
      - run: npm run build:cloudflare
      - run: npm run check:deploy
      - run: docker build -t bcnatlas-api:check .
      - name: Check container startup without credentials
        run: |
          docker run -d --name atlas-check -p 8000:8000 bcnatlas-api:check
          trap 'docker logs atlas-check; docker rm -f atlas-check' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 2
          done
          exit 1
